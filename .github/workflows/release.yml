name: Release and Publish to NPM

on:
  release:
    types: [published]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write  # Required for uploading release assets
      id-token: write  # Required for npm provenance
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          
      - name: Get release version
        id: get_version
        run: |
          # Extract version from GitHub release tag (remove 'v' prefix if present)
          VERSION=${GITHUB_REF#refs/tags/}
          VERSION=${VERSION#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Release version: $VERSION"
          
          
      - name: Verify version consistency
        # This workflow used to derive the version from the tag and then use it
        # only for the tarball filename, so `npm publish` shipped whatever
        # package.json happened to say. Tagging v1.5.0 while package.json read
        # 1.4.0 republished 1.4.0 - or collided.
        #
        # The repository is now the source of truth: the tag must match both
        # manifests. That keeps the version in git history, where an audit can
        # find it, instead of being injected at publish time. Bump both files in
        # a commit, then tag.
        run: |
          TAG_VERSION="${{ steps.get_version.outputs.version }}"
          PKG_VERSION=$(node -p "require('./mcpWinCCOA/package.json').version")
          SIOS_VERSION=$(node -p "require('./package.winccoa.json').Version")

          echo "tag                  : $TAG_VERSION"
          echo "package.json         : $PKG_VERSION"
          echo "package.winccoa.json : $SIOS_VERSION"

          FAILED=0
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Release tag ($TAG_VERSION) does not match mcpWinCCOA/package.json ($PKG_VERSION)."
            FAILED=1
          fi
          if [ "$TAG_VERSION" != "$SIOS_VERSION" ]; then
            echo "::error::Release tag ($TAG_VERSION) does not match package.winccoa.json ($SIOS_VERSION). The SIOS manifest must be bumped in lockstep."
            FAILED=1
          fi
          [ "$FAILED" -eq 0 ] || exit 1
          echo "Versions are consistent."

      - name: Install dependencies
        run: |
          cd mcpWinCCOA
          # Use --ignore-scripts to prevent postinstall from running during build
          # postinstall should only run when users install the published package
          npm install --ignore-scripts

      - name: Type check
        working-directory: mcpWinCCOA
        run: npx tsc --noEmit

      - name: Run tests
        working-directory: mcpWinCCOA
        # docs/dev/release.md always claimed the release ran the tests. It did not.
        run: npm test

      - name: Audit dependencies
        working-directory: mcpWinCCOA
        run: npm audit --audit-level=high
          
      - name: Build project
        working-directory: mcpWinCCOA
        # Single shared build recipe (build.mjs): compiles TypeScript, copies the
        # runtime assets (fields, system prompt, demo instructions) and sets the
        # executable bits. Do not inline the steps here - it drifts.
        run: npm run build

      - name: Stage root documents for the package
        working-directory: mcpWinCCOA
        # npm cannot include files from outside the package directory, so the
        # OSS disclosure documents are copied in. They are listed in the
        # committed `files` array in package.json.
        run: |
          cp ../README.md ../OSS.md ../LEGAL_INFO.md ../LICENSE.md .
          ls -la README.md OSS.md LEGAL_INFO.md LICENSE.md
          
      - name: Verify build
        run: |
          cd mcpWinCCOA
          echo "Checking build output..."
          ls -la build/
          echo "Package.json contents:"
          cat package.json
          
      - name: Generate SBOM
        working-directory: mcpWinCCOA
        # Regenerated at release time so the SBOM matches the published artifact.
        run: npm run sbom

      - name: Publish to npm
        run: |
          cd mcpWinCCOA
          npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          
      - name: Create GitHub release assets
        run: |
          cd mcpWinCCOA
          # Create a tarball for GitHub release
          npm pack
          mv *.tgz winccoa-mcp-server-${{ steps.get_version.outputs.version }}.tgz
          
      - name: Build SIOS delivery archive
        working-directory: mcpWinCCOA
        # Runs after "Generate SBOM", and `npm run zip` deliberately does not
        # regenerate it - the archive ships the same sbom.json that was audited.
        # Separate channel from npm: extracted and run directly rather than
        # installed, so it carries QUICKSTART.md and the manifests its step 2
        # needs. Scripted so the contents cannot drift or silently lose a file.
        run: npm run zip

      - name: Upload release assets
        # actions/upload-release-asset@v1 is archived and unmaintained (Node 12
        # era). `gh release upload` ships with the runner and is the supported
        # route; it also uploads both assets in one step.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          cd mcpWinCCOA
          cp sbom.json "winccoa-mcp-server-${VERSION}-sbom.json"
          gh release upload "${{ github.event.release.tag_name }}" \
            "winccoa-mcp-server-${VERSION}.tgz" \
            "winccoa-mcp-server-${VERSION}-sbom.json" \
            "dist/winccoa-mcp-server-${VERSION}-sios.zip" \
            --clobber
