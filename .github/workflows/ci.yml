name: CI

on:
  push:
    branches: ['**']  # Run on all branches
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        # Windows is a first-class target: WinCC OA ships on it, and the build
        # must stay shell-free. Do not drop this leg.
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mcpWinCCOA/package-lock.json

      - name: Install dependencies
        working-directory: mcpWinCCOA
        # --ignore-scripts skips postinstall (which requires WinCC OA project context)
        run: npm install --ignore-scripts

      - name: Type check
        working-directory: mcpWinCCOA
        run: npx tsc --noEmit

      - name: Run unit tests
        working-directory: mcpWinCCOA
        run: npm test

      - name: Build
        working-directory: mcpWinCCOA
        run: npm run build

      - name: Verify build output
        working-directory: mcpWinCCOA
        # Guards the assets tsc does not emit - a bare `tsc` leaves these out and
        # the server then fails at runtime looking for its fields/system prompt.
        shell: bash
        run: |
          for f in build/index_http.js build/index_stdio.js build/systemprompt.md \
                   build/fields/default.md build/config/demo-project-instructions.md; do
            test -f "$f" || { echo "missing build output: $f"; exit 1; }
          done
          echo "build output complete"

  coverage:
    name: Coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mcpWinCCOA/package-lock.json

      - name: Install dependencies
        working-directory: mcpWinCCOA
        run: npm install --ignore-scripts

      - name: Run tests with coverage
        working-directory: mcpWinCCOA
        run: npm run test:coverage
